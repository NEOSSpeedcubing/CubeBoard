<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEOSS CubeBoard</title>
<style>
:root{
  --bg:#f3f2fa; --card:#fff; --ink:#25234f; --muted:#6c6a8f; --line:#e4e2f2;
  --blue:#5794d0; --cyan:#45b9e6; --purple:#a15ea5; --indigo:#5f5aa8; --deep:#3b3a7a;
  --green:#8fc16f; --green2:#3f8f3a; --danger:#c92a5a;
  --gold:#f5b301; --silver:#aab2c8; --bronze:#c9803f;
  --grad:linear-gradient(110deg,#5f5aa8,#a15ea5);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:15px}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.muted{color:var(--muted)}

/* header */
header{background:linear-gradient(110deg,#2f2e66,#4c4a98 55%,#8a54a0);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 24px;flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px #25234f33}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;text-decoration:none;color:#fff}
.brand .lt{background:#fff;border-radius:12px;width:44px;height:48px;display:flex;align-items:center;justify-content:center;padding:4px}
.brand .lt img{max-width:100%;max-height:100%}
.brand .bt{font-size:20px;letter-spacing:.4px}
.brand .bt b{font-weight:700;background:linear-gradient(90deg,#9be0ff,#c4f0a8);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{font-size:11px;background:linear-gradient(90deg,var(--cyan),var(--green));color:#16314a;padding:3px 9px;border-radius:99px;letter-spacing:1px;font-weight:700}
.tabs{margin-left:auto;display:flex;gap:6px}
.tabs button{background:#ffffff14;border:1px solid #ffffff44;color:#fff;padding:8px 16px;border-radius:99px;cursor:pointer;font-size:14px}
.tabs button.on{background:#fff;color:var(--deep);border-color:#fff;font-weight:700}
main{padding:22px;max-width:1500px;margin:auto}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 8px #25234f0d}
.card h3{margin:0 0 12px;font-size:16px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.6px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px #5f5aa822}
.btn{background:var(--grad);color:#fff;border:0;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{background:#d4d2e6;cursor:not-allowed;filter:none}
.btn.alt{background:linear-gradient(110deg,#45b9e6,#5794d0)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--danger)}
.btn.sm{padding:6px 11px;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.back{display:inline-block;margin-bottom:12px;color:var(--indigo);font-weight:600;cursor:pointer;font-size:14px}
.back:hover{text-decoration:underline}
.pagehead{margin:6px 0 18px}
.pagehead h2{margin:0;font-size:28px}
.pagehead .sub{color:var(--muted);margin-top:2px}

/* flags + avatar */
.flag{display:inline-block;width:22px;height:15px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1px solid #0000001f}
.flag.id{background:linear-gradient(#e70011 50%,#fff 50%)}
.flag.cn{background:radial-gradient(circle at 28% 32%,#ffde00 0 2px,transparent 2.5px),#de2910}
.flag.gen{width:auto;height:auto;padding:1px 5px;font-size:10px;font-weight:700;background:#ebe9f7;color:var(--indigo)}
.av{display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;margin-right:10px;vertical-align:middle;flex:none}

/* competition cards */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.ccard{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:.18s;box-shadow:0 2px 8px #25234f0d}
.ccard:hover{transform:translateY(-3px);box-shadow:0 10px 26px #5f5aa83a}
.cstrip{height:70px;background:linear-gradient(120deg,#5794d0,#5f5aa8 55%,#a15ea5);position:relative}
.cstrip::after{content:"";position:absolute;right:-20px;top:-30px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#8fc16f88,transparent 65%)}
.cbody{padding:16px 18px 18px}
.cbody h3{margin:0 0 4px;font-size:18px}
.cmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{background:#efedf9;color:var(--indigo);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600}
.newbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.newbar input{max-width:360px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:20px;color:#fff;padding:24px 28px;display:flex;gap:24px;align-items:center;background:linear-gradient(120deg,#3b3a7a,#5f5aa8 55%,#a15ea5);margin-bottom:18px}
.hero::before{content:"";position:absolute;right:-60px;top:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#45b9e655,transparent 65%)}
.hero::after{content:"";position:absolute;right:160px;bottom:-110px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,#8fc16f55,transparent 65%)}
.logotile{background:#fff;border-radius:20px;width:104px;height:116px;display:flex;align-items:center;justify-content:center;padding:8px;flex:none;box-shadow:0 6px 18px #0003;position:relative;z-index:1}
.logotile img{max-width:100%;max-height:100%}
.heroTxt{position:relative;z-index:1}
.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.8}
.hero h1{margin:4px 0 8px;font-size:30px;line-height:1.15}
.herometa{display:flex;gap:10px 18px;flex-wrap:wrap;font-size:14px;opacity:.95}
.hero p{margin:10px 0 0;max-width:760px;opacity:.9;font-size:14px;line-height:1.5}
@media(max-width:700px){.hero{flex-direction:column;align-items:flex-start}}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:8px 16px;border-radius:99px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.chip:hover{border-color:var(--indigo);color:var(--indigo)}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--indigo))}
.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.7px}
.stat b{display:block;font-size:24px;margin-top:2px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:6px;background:#ecebf7;border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:9px}

/* podium */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:6px 0 22px;flex-wrap:wrap}
.pod{width:230px;border-radius:18px 18px 10px 10px;text-align:center;padding:16px 12px 18px;color:#fff;position:relative}
.pod .av{width:48px;height:48px;font-size:17px;margin:6px 0 8px;border:3px solid #ffffffaa}
.pod .pname{font-weight:700;font-size:16px;line-height:1.2}
.pod .pavg{font-size:30px;font-weight:800;margin-top:6px}
.pod .psub{font-size:12px;opacity:.9}
.pod .medal{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:32px;height:32px;border-radius:50%;background:#fff;color:var(--ink);font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px #0003}
.g1{background:linear-gradient(160deg,#f5b301,#e08a00);min-height:215px}
.g2{background:linear-gradient(160deg,#9aa6c4,#6f7ca3);min-height:185px}
.g3{background:linear-gradient(160deg,#d4935a,#a8602a);min-height:165px}

/* table */
.titlebar{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.titlebar h2{margin:0;font-size:24px}
.titlebar .sub{color:var(--muted);font-size:13px}
.titlebar .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.titlebar .right input{width:240px}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:auto;box-shadow:0 2px 8px #25234f0d}
table{border-collapse:collapse;width:100%;min-width:780px}
th,td{padding:10px 12px;text-align:right;white-space:nowrap}
th{background:linear-gradient(180deg,#f0eefb,#e8e5f7);color:#4a4883;font-size:12px;text-transform:uppercase;letter-spacing:.6px;position:sticky;top:0}
td{border-top:1px solid #f0eef9}
th.l,td.l{text-align:left}
tbody tr:hover td{background:#f8f7fe}
td.avg{font-weight:700}
td.best{font-weight:600;color:var(--indigo)}
.drop{color:#a5a3c2}
.hl{background:#e5f4dc;color:var(--green2);border-radius:7px;padding:2px 8px}
.rank{display:inline-block;min-width:32px;text-align:center;padding:3px 0;border-radius:9px;font-weight:700;font-size:13px;background:#efedf9;color:var(--ink)}
.rank.q{background:linear-gradient(110deg,#6fb552,#8fc16f);color:#fff}
.rank.p1{background:var(--gold);color:#3d2d00}
.rank.p2{background:var(--silver);color:#1c2333}
.rank.p3{background:var(--bronze);color:#fff}
tr.cut td{border-top:2px dashed var(--green)}
.empty{padding:42px;text-align:center;color:var(--muted)}

/* organizer layout */
.layout{display:grid;grid-template-columns:370px 1fr;gap:22px;align-items:start}
@media(max-width:1000px){.layout{grid-template-columns:1fr}}
.who{min-height:46px;margin-top:8px;padding:10px 12px;border-radius:10px;background:#e8f6e0;color:var(--green2);font-weight:600}
.who.bad{background:#fdeaf0;color:var(--danger)}
.who.idle{background:#f0eefb;color:var(--muted);font-weight:400}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:#fff;color:var(--indigo);font-size:12px;font-weight:700}
.att{display:flex;align-items:center;gap:10px;margin-top:8px}
.att span{width:74px;color:var(--muted);font-size:13px}
.att input{font-size:18px;font-variant-numeric:tabular-nums}
.att input:disabled{background:#f4f3fb}
.sum{display:flex;gap:10px;margin-top:14px}
.sum div{flex:1;background:linear-gradient(135deg,#efedfb,#e3f2fb);border-radius:12px;padding:10px 12px}
.sum small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.sum b{font-size:22px;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
@media(max-width:1000px){.two{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:22px}
.list{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.list table{min-width:0}
.list td,.list th{padding:6px 10px;font-size:13px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
h2.sec{margin:34px 0 14px;font-size:22px}

/* gate + toast */
.gate{position:fixed;inset:0;background:#1d1b4acc;backdrop-filter:blur(4px);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.gbox{background:#fff;border-radius:20px;padding:28px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 60px #0006}
.gbox img{height:84px;margin-bottom:6px}
.gbox h3{margin:6px 0 4px;font-size:20px}
.gbox p{margin:0 0 14px;color:var(--muted);font-size:14px}
.gbox input{text-align:center;letter-spacing:2px}
.gbox .row{justify-content:center;margin-top:14px}
.gerr{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
@media print{header,.titlebar .right,.chips,.back,.gate{display:none!important}main{padding:0}body{background:#fff}.hero{color:#000;background:#fff;border:1px solid #ccc}.hero::before,.hero::after{display:none}}
</style>
</head>
<body>

<header>
  <a class="brand" onclick="goHome()"><span class="lt"><img id="hLogo" alt="NEOSS"></span><span class="bt">NEOSS <b>CubeBoard</b></span><small id="hBadge" class="hide">ORGANIZER</small></a>
  <div class="tabs">
    <button id="tabPublic" onclick="switchView('public')">Public view</button>
    <button id="tabOrg" onclick="switchView('org')">Organizer</button>
  </div>

<main id="app"></main>

<div class="gate hide" id="gate">

    <input id="gCode" type="password" placeholder="Access code" autocomplete="off">
    <div class="gerr" id="gErr"></div>
    <div class="row"><button class="btn" onclick="tryGate()">Unlock</button><button class="btn ghost" onclick="cancelGate()">Cancel</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

function norm(d){
  d.comps.forEach(c=>{
    c.competitors=c.competitors||[];
    if(!c.rounds||!c.rounds.length)c.rounds=[newRound('3x3x3 Cube - First Round')];
    if(!c.rounds.find(r=>r.id===c.cur))c.cur=c.rounds[0].id;
    c.avgMode=c.avgMode||'ceil';
    ['start','end','venue','country','desc'].forEach(k=>{if(c[k]==null)c[k]=''});
  });
  return d;
}

}

/* ================= time helpers ================= */
function parseTime(str){
  str=String(str).trim().toLowerCase();
  if(str==='')return null;
  if(str==='d'||str==='f'||str==='dnf')return -1;
  if(str==='s'||str==='dns')return -2;
  if(/^\d+$/.test(str)){
    const n=parseInt(str,10);
    return Math.floor(n/10000)*6000+Math.floor((n%10000)/100)*100+(n%100);
  }
  const m=str.match(/^(?:(\d+):)?(\d+)(?:\.(\d{1,2}))?$/);
  if(!m)return undefined;
  return (m[1]?+m[1]:0)*6000+(+m[2])*100+(m[3]?+(m[3].padEnd(2,'0')):0);
}
function fmt(cs){ // single, centiseconds
  if(cs===null||cs===undefined)return '';
  if(cs===-1)return 'DNF';
  if(cs===-2)return 'DNS';
  const m=Math.floor(cs/6000),s=Math.floor((cs%6000)/100),c=cs%100;
  const cc=String(c).padStart(2,'0');
  return m>0?`${m}:${String(s).padStart(2,'0')}.${cc}`:`${s}.${cc}`;
}
function fmtAvg(ms){ // average, milliseconds, 3 decimals
  if(ms===null||ms===undefined)return '';
  if(ms<0)return 'DNF';
  const m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000),r=String(ms%1000).padStart(3,'0');
  return m>0?`${m}:${String(s).padStart(2,'0')}.${r}`:`${s}.${r}`;
}
const bad=v=>v===-1||v===-2;
function calc(a,mode){
  const vals=a.filter(v=>v!==null&&v!==undefined);
  const ok=vals.filter(v=>!bad(v));
  const best=ok.length?Math.min(...ok):(vals.length?-1:null);
  let avg=null,dropBest=-1,dropWorst=-1;
  if(vals.length===5){
    const key=i=>bad(a[i])?Infinity:a[i];
    const sorted=[0,1,2,3,4].sort((x,y)=>key(x)-key(y));
    dropBest=sorted[0];dropWorst=sorted[4];
    if(a.filter(bad).length>=2)avg=-1;
    else{
      const sum=sorted.slice(1,4).reduce((p,i)=>p+a[i],0); // centiseconds
      if(mode==='exact')avg=Math.round(sum*10/3);
      else if(mode==='round')avg=Math.round(sum/3)*10;
      else avg=Math.ceil(sum/3)*10;
    }
  }
  return {best,avg,dropBest,dropWorst};
}

/* ================= ranking & table ================= */
function ranked(c,r){
  const rows=Object.entries(r.results).map(([id,att])=>({c:findP(c,id)||{id,name:'(unknown)',country:''},att,...calc(att,c.avgMode)}));
  const k=v=>(v===-1||v===null)?Infinity:v;
  rows.sort((a,b)=>k(a.avg)-k(b.avg)||k(a.best)-k(b.best));
  rows.forEach((x,i)=>{const p=rows[i-1];x.rank=(p&&k(p.avg)===k(x.avg)&&k(p.best)===k(x.best))?p.rank:i+1});
  return rows;
}
function flag(country){
  const k=(country||'').toLowerCase();
  if(k==='indonesia'||k==='id')return '<span class="flag id" title="Indonesia"></span>';
  if(k==='china'||k==='cn')return '<span class="flag cn" title="China"></span>';
  return country?`<span class="flag gen">${esc(country.slice(0,2).toUpperCase())}</span>`:'';
}
function avatar(p){
  const ini=String(p.name||'?').replace(/\(.*?\)/g,'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
  let h=0;for(const ch of String(p.id))h=(h*31+ch.charCodeAt(0))>>>0;
  return `<span class="av" style="background:${AVC[h%AVC.length]}">${esc(ini)}</span>`;
}
function tableHTML(c,r,showId,filter){
  let rows=ranked(c,r);
  if(!rows.length)return '<div class="tablewrap"><div class="empty">No results yet.</div></div>';
  const adv=+r.advance||0;
  let bestSingle=Infinity,bestAvg=Infinity;
  rows.forEach(x=>{x.att.forEach(v=>{if(v>0&&v<bestSingle)bestSingle=v});if(x.avg>0&&x.avg<bestAvg)bestAvg=x.avg});
  const all=rows;
  if(filter){const f=filter.toLowerCase();rows=rows.filter(x=>x.c.name.toLowerCase().includes(f)||String(x.c.id)===filter)}
  if(!rows.length)return '<div class="tablewrap"><div class="empty">No match.</div></div>';
  let h='<div class="tablewrap"><table><thead><tr><th>#</th>'+(showId?'<th>ID</th>':'')+'<th class="l">Name</th><th class="l">Country</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>Average</th><th>Best</th></tr></thead><tbody>';
  rows.forEach((x,i)=>{
    let cls='rank';
    if(adv&&x.rank<=adv)cls+=' q';
    if(x.rank===1)cls='rank p1';else if(x.rank===2)cls='rank p2';else if(x.rank===3)cls='rank p3';
    const cut=adv&&!filter&&i>0&&rows[i-1].rank<=adv&&x.rank>adv;
    const full=x.att.filter(v=>v!==null).length===5;
    h+=`<tr class="${cut?'cut':''}" ${showId?`data-id="${esc(x.c.id)}" onclick="loadForEdit(this.dataset.id)" style="cursor:pointer"`:''}><td><span class="${cls}">${x.rank}</span></td>`;
    if(showId)h+=`<td class="num">${esc(x.c.id)}</td>`;
    h+=`<td class="l">${avatar(x.c)}<b>${esc(x.c.name)}</b></td><td class="l">${flag(x.c.country)}${esc(x.c.country||'')}</td>`;
    for(let j=0;j<5;j++){
      const v=x.att[j];let t=fmt(v);
      if(full&&(j===x.dropBest||j===x.dropWorst)&&t)t=`<span class="drop">(${t})</span>`;
      h+=`<td class="num">${t}</td>`;
    }
    const aT=full?fmtAvg(x.avg):'';
    h+=`<td class="num avg">${full&&x.avg===bestAvg?`<span class="hl">${aT}</span>`:aT}</td>`;
    const bT=fmt(x.best);
    h+=`<td class="num best">${x.best===bestSingle?`<span class="hl">${bT}</span>`:bT}</td></tr>`;
  });
  return h+'</tbody></table></div>';
}

/* ================= shared page pieces ================= */
function fmtDates(s,e){
  if(!s)return '';
  const a=new Date(s+'T00:00:00');if(isNaN(a))return '';
  const full=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  if(!e||e===s)return full(a);
  const b=new Date(e+'T00:00:00');if(isNaN(b))return full(a);
  if(a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear())
    return `${a.toLocaleDateString('en-US',{month:'short'})} ${a.getDate()} - ${b.getDate()}, ${a.getFullYear()}`;
  return `${full(a)} - ${full(b)}`;
}

}
function statsHTML(c,r){
  const rows=ranked(c,r),total=c.competitors.length,n=rows.length;
  let fast=null;rows.forEach(x=>x.att.forEach(v=>{if(v>0&&(!fast||v<fast.v))fast={v,name:x.c.name}}));
  const top=rows.find(x=>x.avg!==null&&x.avg>0);
  const pct=total?Math.min(100,Math.round(n/total*100)):0;
  return `<div class="stat" style="--c:#5794d0"><small>👥 Competitors</small><b>${total}</b><span>registered</span></div>
  <div class="stat" style="--c:#8fc16f"><small>✅ Entered</small><b>${n} / ${total}</b><div class="bar"><i style="width:${pct}%"></i></div></div>
  <div class="stat" style="--c:#45b9e6"><small>⚡ Fastest single</small><b>${fast?fmt(fast.v):'–'}</b><span>${fast?esc(fast.name):'no results yet'}</span></div>
  <div class="stat" style="--c:#a15ea5"><small>🏆 Best average</small><b>${top?fmtAvg(top.avg):'–'}</b><span>${top?esc(top.c.name):'no results yet'}</span></div>`;
}
function podiumHTML(c,r){
  const rows=ranked(c,r).filter(x=>x.avg!==null&&x.avg>0&&x.att.every(v=>v!==null)).slice(0,3);
  if(!rows.length)return '';
  return `<div class="podium">${[1,0,2].filter(i=>rows[i]).map(i=>{const x=rows[i];
    return `<div class="pod g${i+1}"><div class="medal">${x.rank}</div>${avatar(x.c)}<div class="pname">${esc(x.c.name)}</div><div class="pavg num">${fmtAvg(x.avg)}</div><div class="psub">average • best ${fmt(x.best)}</div></div>`}).join('')}</div>`;
}
function chipsHTML(c,activeId,fn){
  return c.rounds.map(r=>`<button class="chip ${r.id===activeId?'on':''}" data-r="${r.id}" onclick="${fn}(this.dataset.r)">${esc(r.name)}</button>`).join('');
}
function subLine(c,r){
  return `${Object.keys(r.results).length} of ${c.competitors.length} entered`+(r.limit?` • Time limit: ${esc(r.limit)}`:'')+(r.cutoff?` • Cutoff: ${esc(r.cutoff)}`:'');
}
function compCard(c,mode){
  const d=fmtDates(c.start,c.end);
  const ent=c.rounds.reduce((n,r)=>n+Object.keys(r.results).length,0);
  return `<div class="ccard" data-id="${c.id}" onclick="go('${mode}',this.dataset.id)"><div class="cstrip"></div><div class="cbody">
    <h3>${flag(c.country)}${esc(c.name)}</h3>
    <div class="muted">${d?esc(d):'Date not set'}${c.venue?' • '+esc(c.venue):''}</div>
    <div class="cmeta"><span class="tag">👥 ${c.competitors.length}</span><span class="tag">🧩 ${c.rounds.length} round${c.rounds.length>1?'s':''}</span><span class="tag">⏱ ${ent} results</span></div>
    ${mode==='org'?`<div class="row" style="margin-top:14px"><button class="btn sm" data-id="${c.id}" onclick="event.stopPropagation();go('org',this.dataset.id)">Manage</button><button class="btn ghost sm" data-id="${c.id}" onclick="event.stopPropagation();go('public',this.dataset.id)">Public page</button><button class="btn danger sm" style="margin-left:auto" data-id="${c.id}" onclick="event.stopPropagation();deleteComp(this.dataset.id)">Delete</button></div>`:''}
  </div></div>`;
}

/* ================= routing ================= */
function readHash(){
  const p=location.hash.replace(/^#/,'').split('/');
  R.view=p[0]==='org'?'org':'public';
  R.comp=(p[1]&&DB.comps.find(c=>c.id===p[1]))?p[1]:null;
}
function go(v,id){const h='#'+v+(id?'/'+id:'');if(location.hash===h)render();else location.hash=h}
function switchView(v){go(v,R.comp)}
function goHome(){go(R.view)}
window.addEventListener('hashchange',render);
function render(){
  readHash();
  const locked=R.view==='org'&&!unlocked();
  const showOrg=R.view==='org'&&!locked;
  $('tabPublic').classList.toggle('on',!showOrg);
  $('tabOrg').classList.toggle('on',showOrg);
  $('hBadge').classList.toggle('hide',!showOrg);
  if(locked){showGate();renderPubHome();return}
  hideGate();
  if(R.view==='public')R.comp?buildPubComp():renderPubHome();
  else R.comp?buildOrgComp():renderOrgHome();
  window.scrollTo(0,0);
}

/* ================= access gate ================= */
function showGate(){$('gate').classList.remove('hide');$('gCode').value='';$('gErr').textContent='';setTimeout(()=>$('gCode').focus(),50)}
function hideGate(){$('gate').classList.add('hide')}
function tryGate(){
  if($('gCode').value.trim()===CODE){
    try{sessionStorage.setItem('cb_ok','1')}catch(e){okMem=true}
    hideGate();render();
  }else{
    $('gErr').textContent='Wrong access code.';
    const b=$('gbox');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
    $('gCode').select();
  }
}
function cancelGate(){hideGate();go('public',R.comp)}
$('gCode').addEventListener('keydown',e=>{if(e.key==='Enter')tryGate();if(e.key==='Escape')cancelGate()});

/* ================= public pages ================= */
function renderPubHome(){
  $('app').innerHTML=`<div class="pagehead"><h2>Competitions</h2><div class="sub">Pick a competition to see its live results</div></div>`+
    (DB.comps.length?`<div class="cgrid">${DB.comps.map(c=>compCard(c,'public')).join('')}</div>`:'<div class="card empty">No competitions yet.</div>');
}
function buildPubComp(){
  const c=C();pubRound=c.cur;
  $('app').innerHTML=`<a class="back" onclick="go('public')">← All competitions</a>
  <div id="hero"></div><div class="chips" id="chips"></div><div class="stats" id="stats"></div><div id="podium"></div>
  <div class="titlebar"><div><h2 id="rName"></h2><div class="sub" id="rSub"></div></div>
  <div class="right"><input id="pSearch" placeholder="Search name or ID…" autocomplete="off"><button class="btn ghost sm" onclick="window.print()">Print</button></div></div>
  <div id="tbl"></div>`;
  $('pSearch').addEventListener('input',refreshPubTable);
  refreshPub();
}
function refreshPub(){
  const c=C();if(!c)return render();
  if(!c.rounds.find(r=>r.id===pubRound))pubRound=c.cur;
  const r=c.rounds.find(r=>r.id===pubRound);
  $('hero').innerHTML=heroHTML(c);
  $('chips').innerHTML=chipsHTML(c,pubRound,'setPubRound');
  $('stats').innerHTML=statsHTML(c,r);
  $('podium').innerHTML=podiumHTML(c,r);
  $('rName').textContent=r.name;$('rSub').innerHTML=subLine(c,r);
  refreshPubTable();
}
function refreshPubTable(){
  const c=C();if(!c)return;
  const r=c.rounds.find(r=>r.id===pubRound);if(!r)return;
  $('tbl').innerHTML=tableHTML(c,r,false,$('pSearch').value.trim());
}
function setPubRound(id){pubRound=id;refreshPub()}

/* ================= organizer: home ================= */
function renderOrgHome(){
  $('app').innerHTML=`<div class="pagehead"><h2>Competitions</h2><div class="sub">Create, open and manage your competitions</div></div>
  <div class="newbar"><input id="newComp" placeholder="New competition name…"><button class="btn" onclick="createComp()">+ Create competition</button></div>
  ${DB.comps.length?`<div class="cgrid">${DB.comps.map(c=>compCard(c,'org')).join('')}</div>`:'<div class="card empty">No competitions yet. Create one above.</div>'}`;
  $('newComp').addEventListener('keydown',e=>{if(e.key==='Enter')createComp()});
}
function createComp(){
  const n=$('newComp').value.trim();if(!n){toast('Enter a name');return}
  const c=newComp(n);c.cur=c.rounds[0].id;DB.comps.push(c);persist();go('org',c.id);
}
function deleteComp(id){
  const c=DB.comps.find(x=>x.id===id);if(!c)return;
  if(!confirm(`Delete "${c.name}" with all its competitors and results? This cannot be undone.`))return;
  DB.comps=DB.comps.filter(x=>x.id!==id);
  if(!DB.comps.length)DB.comps.push(newComp('My Competition'));
  norm(DB);persist();go('org');
}

/* ================= organizer: competition page ================= */
let curId=null;const attEl=[];
function buildOrgComp(){
  const c=C();curId=null;attEl.length=0;
  $('app').innerHTML=`<a class="back" onclick="go('org')">← All competitions</a>
  <div id="hero"></div>
  <div class="layout">
    <div class="card">
      <h3>Enter result</h3>
      <label>Competitor ID</label>
      <input id="idIn" inputmode="numeric" placeholder="Type ID, then Enter" autocomplete="off">
      <div class="who idle" id="who">Waiting for ID…</div>
      <div id="atts"></div>
      <div class="sum"><div><small>Best</small><b id="sBest">–</b></div><div><small>Average (5)</small><b id="sAvg">–</b></div></div>
      <div class="row" style="margin-top:14px">
        <button class="btn" id="saveBtn" disabled onclick="saveResult()">Save result</button>
        <button class="btn ghost" onclick="clearEntry()">Clear</button>
        <button class="btn danger sm" id="delBtn" style="margin-left:auto" disabled onclick="deleteResult()">Delete</button>
      </div>
      <div class="hint">Type digits like <b>607</b> → 6.07, <b>10532</b> → 1:05.32. Also accepts <b>6.07</b>, <b>1:05.32</b>, <b>dnf</b>/<b>d</b>, <b>dns</b>/<b>s</b>. <b>Enter</b> moves to the next box; Enter on attempt 5 saves. Best and worst are dropped; the average is the mean of the middle 3 (two or more DNFs = DNF).</div>
    </div>
    <div>
      <div class="chips" id="chips"></div>
      <div class="stats" id="stats"></div>
      <div class="titlebar"><div><h2 id="rName"></h2><div class="sub" id="rSub"></div></div></div>
      <div id="tbl"></div>
    </div>
  </div>

  <h2 class="sec">Competition settings</h2>
  <div class="two">
    <div class="stack">
      <div class="card">
        <h3>Competition details</h3>
        <label>Name</label><input id="dName">
        <div class="grid2"><div><label>Start date</label><input id="dStart" type="date"></div><div><label>End date</label><input id="dEnd" type="date"></div></div>
        <div class="grid2"><div><label>Venue / city</label><input id="dVenue" placeholder="e.g. Surabaya"></div><div><label>Country</label><input id="dCountry" placeholder="Indonesia"></div></div>
        <label>Description</label><textarea id="dDesc" rows="3" placeholder="Short info shown on the public page"></textarea>
        <label>Average calculation</label>
        <select id="dMode">
          <option value="ceil">Round up to 0.01 s, show 3 decimals (8.5433 → 8.550)</option>
          <option value="exact">Exact, 3 decimals (8.5433 → 8.543)</option>
          <option value="round">Normal rounding to 0.01 s (8.5433 → 8.540)</option>
        </select>
        <div class="hint">Details save automatically when you leave a field.</div>
      </div>
      <div class="card">
        <h3>Rounds</h3>
        <div class="row"><input id="newRound" placeholder="e.g. 3x3x3 Cube - Final" style="flex:1"><button class="btn alt" onclick="addRound()">Add round</button></div>
        <label>Current round</label>
        <input id="rdName">
        <div class="grid3" style="margin-top:8px">
          <div><small class="hint">Advancing (top N)</small><input id="advN" type="number" min="0"></div>
          <div><small class="hint">Time limit</small><input id="tLimit" placeholder="3:00.00"></div>
          <div><small class="hint">Cutoff</small><input id="cutoff" placeholder="None"></div>
        </div>
        <div class="row" style="margin-top:12px"><button class="btn danger sm" onclick="deleteRound()">Delete current round</button></div>
      </div>
    </div>
    <div class="stack">
      <div class="card">
        <h3>Competitors (<span id="cCount">0</span>)</h3>
        <div class="row">
          <input id="cId" placeholder="ID" style="width:80px" inputmode="numeric">
          <input id="cName" placeholder="Name" style="flex:1;min-width:120px">
          <input id="cCountry" placeholder="Country" style="width:110px">
          <button class="btn alt" onclick="addCompetitor()">Add</button>
        </div>
        <label>Or paste many (one per line: ID, Name, Country)</label>
        <textarea id="bulk" rows="4" placeholder="70, Muhammad Faeyza Koda, Indonesia&#10;44, Alvin Wongsosaputro, Indonesia"></textarea>
        <div class="row" style="margin-top:8px"><button class="btn ghost sm" onclick="bulkAdd()">Import pasted list</button></div>
        <div class="list"><table><thead><tr><th class="l">ID</th><th class="l">Name</th><th class="l">Country</th><th></th></tr></thead><tbody id="cList"></tbody></table></div>
      </div>
      <div class="card">
        <h3>Backup &amp; share</h3>
        <div class="row">
          <button class="btn ghost sm" onclick="exportJSON()">Export all (JSON)</button>
          <button class="btn ghost sm" onclick="$('imp').click()">Import JSON</button>
          <button class="btn ghost sm" onclick="exportCSV()">Export round CSV</button>
          <button class="btn ghost sm" onclick="copyPublicLink()">Copy public link</button>
          <input type="file" id="imp" accept=".json" class="hide" onchange="importJSON(event)">
        </div>
        <div class="hint">Data is stored in this browser. To show results on another device, export the JSON here and import it there.</div>
        <div class="row" style="margin-top:14px"><button class="btn danger sm" onclick="deleteComp(R.comp)">Delete this competition</button></div>
      </div>
    </div>
  </div>`;
  // attempts
  const box=$('atts');
  for(let i=0;i<5;i++){
    const d=document.createElement('div');d.className='att';
    d.innerHTML=`<span>Attempt ${i+1}</span><input disabled autocomplete="off">`;
    box.appendChild(d);
    const inp=d.querySelector('input');attEl.push(inp);
    inp.addEventListener('input',updateSummary);
    inp.addEventListener('blur',()=>{const v=parseTime(inp.value);if(v!==null&&v!==undefined)inp.value=fmt(v);updateSummary()});
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.preventDefault();
        if(parseTime(inp.value)===undefined){toast('Invalid time');return}
        if(i<4)attEl[i+1].focus();else if(!$('saveBtn').disabled)saveResult();
      }
      if(e.key==='Escape')clearEntry();
    });
  }
  $('idIn').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();lookup(true)}if(e.key==='Escape')clearEntry()});
  $('idIn').addEventListener('input',()=>lookup(false));
  ['cId','cName','cCountry'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')addCompetitor()}));
  ['dName','dStart','dEnd','dVenue','dCountry','dDesc','dMode'].forEach(i=>$(i).addEventListener('change',saveDetails));
  ['rdName','advN','tLimit','cutoff'].forEach(i=>$(i).addEventListener('change',saveRound));
  $('newRound').addEventListener('keydown',e=>{if(e.key==='Enter')addRound()});
  fillDetails();fillRound();refreshOrg();
}
function fillDetails(){
  const c=C();
  $('dName').value=c.name;$('dStart').value=c.start;$('dEnd').value=c.end;$('dVenue').value=c.venue;
  $('dCountry').value=c.country;$('dDesc').value=c.desc;$('dMode').value=c.avgMode;
}
function fillRound(){
  const r=OR();if(!r)return;
  $('rdName').value=r.name;$('advN').value=r.advance||0;$('tLimit').value=r.limit||'';$('cutoff').value=r.cutoff||'';
}
function refreshOrg(){
  const c=C();if(!c)return render();
  const r=OR();
  $('hero').innerHTML=heroHTML(c);
  $('chips').innerHTML=chipsHTML(c,c.cur,'setOrgRound');
  $('stats').innerHTML=statsHTML(c,r);
  $('rName').textContent=r.name;$('rSub').innerHTML=subLine(c,r)+' • click a row to edit';
  $('tbl').innerHTML=tableHTML(c,r,true);
  $('cCount').textContent=c.competitors.length;
  $('cList').innerHTML=[...c.competitors].sort((a,b)=>String(a.id).localeCompare(String(b.id),undefined,{numeric:true})).map(p=>
    `<tr><td class="num">${esc(p.id)}</td><td>${esc(p.name)}</td><td>${esc(p.country||'')}</td><td style="text-align:right"><button class="btn ghost sm" data-id="${esc(p.id)}" onclick="removeCompetitor(this.dataset.id)">✕</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No competitors yet.</td></tr>';
}
function setOrgRound(id){C().cur=id;persist();clearEntry();fillRound();refreshOrg()}
function saveDetails(){
  const c=C();
  c.name=$('dName').value.trim()||'Untitled competition';
  c.start=$('dStart').value;c.end=$('dEnd').value;
  c.venue=$('dVenue').value.trim();c.country=$('dCountry').value.trim();
  c.desc=$('dDesc').value.trim();c.avgMode=$('dMode').value;
  persist();refreshOrg();toast('Details saved');
}
function saveRound(){
  const r=OR();if(!r)return;
  r.name=$('rdName').value.trim()||r.name;
  r.advance=Math.max(0,parseInt($('advN').value)||0);
  r.limit=$('tLimit').value.trim();r.cutoff=$('cutoff').value.trim();
  persist();refreshOrg();
}
function addRound(){
  const n=$('newRound').value.trim();if(!n)return;
  const c=C(),r=newRound(n);c.rounds.push(r);c.cur=r.id;$('newRound').value='';
  persist();clearEntry();fillRound();refreshOrg();
}
function deleteRound(){
  const c=C();
  if(c.rounds.length<2){toast('Keep at least one round');return}
  if(!confirm('Delete this round and all its results?'))return;
  c.rounds=c.rounds.filter(r=>r.id!==c.cur);c.cur=c.rounds[0].id;
  persist();clearEntry();fillRound();refreshOrg();
}
function addCompetitor(){
  const c=C(),id=$('cId').value.trim(),name=$('cName').value.trim(),country=$('cCountry').value.trim();
  if(!id||!name){toast('ID and name required');return}
  if(findP(c,id)){toast('ID already exists');return}
  c.competitors.push({id,name,country});
  $('cId').value=$('cName').value='';persist();refreshOrg();$('cId').focus();
}
function bulkAdd(){
  const c=C();let n=0,skip=0;
  $('bulk').value.split('\n').forEach(line=>{
    const p=line.split(/[,\t;]/).map(s=>s.trim());
    if(p.length<2||!p[0]||!p[1])return;
    if(findP(c,p[0])){skip++;return}
    c.competitors.push({id:p[0],name:p[1],country:p[2]||''});n++;
  });
  $('bulk').value='';persist();refreshOrg();toast(`Added ${n}`+(skip?`, skipped ${skip} duplicate IDs`:''));
}
function removeCompetitor(id){
  const c=C(),used=c.rounds.some(r=>r.results[id]);
  if(!confirm(used?'This competitor has results. Remove them and their results?':'Remove competitor?'))return;
  c.competitors=c.competitors.filter(p=>String(p.id)!==String(id));
  c.rounds.forEach(r=>delete r.results[id]);persist();refreshOrg();
}

/* ---- result entry ---- */
function lookup(focus){
  const c=C(),id=$('idIn').value.trim(),w=$('who');
  if(!id){curId=null;w.className='who idle';w.textContent='Waiting for ID…';setAttEnabled(false);updateSummary();return}
  const p=findP(c,id);
  if(!p){curId=null;w.className='who bad';w.textContent='No competitor with ID '+id;setAttEnabled(false);updateSummary();return}
  curId=String(p.id);
  const r=OR(),ex=r.results[curId];
  w.className='who';w.innerHTML=`${esc(p.name)} <span style="font-weight:400;opacity:.8">${flag(p.country)}${esc(p.country||'')}</span>`+(ex?' <span class="pill">editing</span>':'');
  setAttEnabled(true);
  attEl.forEach((el,i)=>el.value=ex?fmt(ex[i]):'');
  $('delBtn').disabled=!ex;
  updateSummary();
  if(focus)attEl[0].focus();
}
function setAttEnabled(on){attEl.forEach(el=>{el.disabled=!on;if(!on)el.value=''});$('delBtn').disabled=true}
function readAtts(){const out=[];for(const el of attEl){const v=parseTime(el.value);if(v===undefined)return null;out.push(v)}return out}
function updateSummary(){
  const a=readAtts();
  if(!curId||!a){$('sBest').textContent='–';$('sAvg').textContent='–';$('saveBtn').disabled=true;return}
  const k=calc(a,C().avgMode);
  $('sBest').textContent=k.best===null?'–':fmt(k.best);
  $('sAvg').textContent=k.avg===null?'–':fmtAvg(k.avg);
  $('saveBtn').disabled=a.every(v=>v===null);
}
function saveResult(){
  const c=C(),r=OR();if(!r||!curId)return;
  const a=readAtts();if(!a){toast('Invalid time in one of the boxes');return}
  if(a.some(v=>v===null)&&!confirm('Not all 5 attempts are filled. Save anyway? (The average shows after 5 attempts.)'))return;
  r.results[curId]=a;persist();
  const k=calc(a,c.avgMode);
  toast(`Saved ${findP(c,curId).name}`+(k.avg!==null?` – average ${fmtAvg(k.avg)}`:''));
  clearEntry();refreshOrg();$('idIn').focus();
}
function deleteResult(){
  const r=OR();if(!r||!curId||!r.results[curId])return;
  if(!confirm('Delete this result?'))return;
  delete r.results[curId];persist();clearEntry();refreshOrg();
}
function clearEntry(){if(!$('idIn'))return;$('idIn').value='';curId=null;lookup(false)}
function loadForEdit(id){$('idIn').value=id;lookup(true);window.scrollTo({top:0,behavior:'smooth'})}

/* ---- export / import ---- */
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function exportJSON(){download('cubeboard-backup.json',JSON.stringify(DB,null,2),'application/json')}
function exportCSV(){
  const c=C(),r=OR();if(!r)return;
  const rows=[['Rank','ID','Name','Country','1','2','3','4','5','Average','Best']];
  ranked(c,r).forEach(x=>{const full=x.att.filter(v=>v!==null).length===5;
    rows.push([x.rank,x.c.id,x.c.name,x.c.country||'',...x.att.map(fmt),full?fmtAvg(x.avg):'',fmt(x.best)])});
  download((c.name+' - '+r.name).replace(/[\\/:*?"<>|]/g,'_')+'.csv',rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');
}
function importJSON(e){
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{
    const d=JSON.parse(rd.result);
    if(Array.isArray(d.comps)){if(!confirm('Replace ALL current data with this backup?'))return;DB=norm(d)}
    else if(d.rounds&&d.competitors){const c=newComp(d.title||'Imported competition');c.competitors=d.competitors;c.rounds=d.rounds;c.cur=d.cur;DB.comps.push(c);norm(DB)}
    else throw 0;
    persist();go('org');render();toast('Imported');
  }catch(_){toast('Invalid backup file')}};
  rd.readAsText(f);e.target.value='';
}
function copyPublicLink(){
  const u=location.href.split('#')[0]+'#public/'+R.comp;
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Link copied'),()=>prompt('Copy this link:',u));
}

/* ================= misc ================= */
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}
window.addEventListener('storage',e=>{
  if(e.key!==KEY)return;
  try{DB=norm(JSON.parse(e.newValue))}catch(_){return}
  readHash();
  if(R.view==='org'&&R.comp&&unlocked()&&$('tbl')&&$('idIn')){refreshOrg()}
  else if(R.view==='public'&&R.comp&&$('tbl')&&$('pSearch')){refreshPub()}
  else render();
});
$('hLogo').src=LOGO;$('gLogo').src=LOGO;
render();
</script>
